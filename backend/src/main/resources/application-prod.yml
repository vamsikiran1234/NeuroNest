spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:neuronest_db}
    username: ${DB_USERNAME:neuronest_user}
    password: ${DB_PASSWORD:neuronest_secure_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    com.neuronest: INFO
    org.springframework.web: WARN
